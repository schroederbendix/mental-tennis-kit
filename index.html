<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Mental Tennis Kit</title>
<meta name="description" content="Free mental tennis training from Bendix Schroeder: a video classroom, on-court routines and a match journal.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* MTC design tokens
   Layout: app shell with a top bar and three tabs (Classroom, Routines, Journal). Classroom opens with a court-diagram hero
   that frames the coach photo inside a service box; modules below as rows. Left-aligned throughout; one column on phones. */
:root{
  --night:#000000;   /* page: black */
  --court-bg:#123A80;/* hero: navy hard court */
  --deep:#0C1E44;    /* panels: deep navy */
  --raise:#15306A;   /* hover / inputs */
  --court:#2F6BD8;   /* hard-court blue: buttons, progress */
  --court-hi:#7FAEF7;/* links, focus on dark */
  --line:#FFFFFF;    /* court-line white: text */
  --mute:#A6B1C8;    /* secondary text */
  --rule:rgba(255,255,255,.14);
  --ball:#D7EF4F;    /* tennis-ball yellow: achievements and the ball */
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--line);font-family:var(--body);font-size:17px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--court-hi)}
:focus-visible{outline:2px solid var(--court-hi);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;margin:0;text-wrap:balance}
.mute{color:var(--mute)}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--line)}
.mark svg{display:block}
.mark span{font-family:var(--display);font-size:23px;font-weight:900;letter-spacing:.04em}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tabs a{text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;padding:18px 12px 16px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--line)}
.tabs a[aria-current="page"]{color:var(--line);border-bottom-color:var(--ball)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--court-bg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;padding-block:64px 72px;position:relative}
.courtbg{position:absolute;inset:0;pointer-events:none;opacity:1}
.courtbg svg{width:100%;height:100%}
.hero h1{font-size:clamp(46px,7.4vw,92px);line-height:.95}
.promise{font-size:clamp(19px,2.2vw,22px);line-height:1.45;margin:22px 0 0;max-width:30ch;color:var(--line)}
.hello{margin:28px 0 0;max-width:52ch;color:#D3DCEE;font-size:16px;line-height:1.65}
.hello b{color:var(--line);font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:transparent;color:var(--line);border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--ball);border-color:var(--ball);color:#000}
.btn.pri:hover{background:#C8E33A}
.btn.sm{padding:8px 14px;font-size:14px}

/* the signature: photo framed in a service box */
.box{position:relative;z-index:0;aspect-ratio:4/5;max-width:420px;width:100%;justify-self:end}
.box .frame{position:absolute;inset:0;border:2px solid var(--line);border-radius:2px}
.box::before{content:"";position:absolute;left:-26px;right:-26px;bottom:38%;border-top:2px solid rgba(255,255,255,.55);z-index:-1}
.box .ph{position:absolute;inset:14px;overflow:hidden;background:#0C1E44}
.box .ph img{width:100%;height:100%;object-fit:cover;display:block}
.box .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:120px;font-style:italic;color:rgba(233,239,248,.18)}
.box .tag{position:absolute;left:-14px;bottom:28px;background:#000;color:#fff;padding:10px 14px;font-weight:700;font-size:14px;line-height:1.3}
.box .tag small{display:block;font-weight:500;color:var(--ball)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:36px;padding-block:44px 52px}.box{justify-self:start;max-width:320px}}

/* sections */
.sec{padding-block:56px 24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sech h2{font-size:clamp(34px,5vw,48px);line-height:1.05}
.lead{color:var(--mute);margin:-10px 0 28px;max-width:58ch}

/* classroom */
.overall{display:flex;align-items:center;gap:14px;color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;width:160px}
.track i{display:block;height:100%;background:var(--court)}
.module{border-top:1px solid var(--rule);padding-block:26px}
.module:last-child{border-bottom:1px solid var(--rule)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.mhead h3{font-size:28px}
.lessons{display:grid;gap:2px}
.lrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--deep)}
.lrow:hover{background:var(--raise)}
.lrow:focus-visible{outline:2px solid var(--court-hi);outline-offset:2px}
.lrow .n{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--mute)}
.lrow.done .n{background:var(--ball);border-color:var(--ball);color:#000}
.lrow .t{font-weight:600;overflow-wrap:anywhere}
.lrow .s{font-size:14px;color:var(--mute)}
.lrow .r{font-size:14px;color:var(--mute);white-space:nowrap}

/* lesson view */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px;margin-bottom:22px;background:none;border:0;padding:0}
.back:hover{color:var(--line)}
.lesson h2{font-size:clamp(34px,5.4vw,54px);line-height:1.04;margin-bottom:8px}
.vid{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:var(--deep);border:1px solid var(--rule);margin-block:24px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.soon{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mute)}
.soon b{display:block;font-family:var(--display);font-weight:800;font-size:30px;color:var(--line);margin-bottom:4px}
.lbody{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.lbody{grid-template-columns:1fr}}
.lbody p{margin:0;font-size:18px;max-width:58ch}
.try{border-left:3px solid var(--ball);padding:4px 0 4px 18px}
.try b{display:block;font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:4px}
.lnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:34px;padding-top:22px;border-top:1px solid var(--rule)}

/* routines */
.routines{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.routine{background:var(--deep);border-radius:16px;padding:24px;display:grid;gap:12px;align-content:start}
.routine h3{font-size:28px;line-height:1.1}
.routine .when{color:var(--mute);font-size:15px}
.routine ol{margin:6px 0 0;padding-left:22px;display:grid;gap:8px}
.routine li::marker{color:var(--court-hi);font-weight:700}

/* journal */
.streak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--deep);border-radius:18px;padding:26px 28px;margin-bottom:22px}
.flame{font-family:var(--display);font-weight:900;font-size:clamp(76px,12vw,120px);line-height:.8;font-variant-numeric:lining-nums}
.flame.on{color:var(--ball)}
.streak .lbl{font-size:18px;font-weight:600}
.streak .sub{color:var(--mute);font-size:15px;margin-top:2px}
.days{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.days span{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mute)}
.days span.on{background:var(--ball);border-color:var(--ball);color:var(--night)}
.days span.today{border-color:var(--court-hi)}
@media (max-width:560px){.streak{grid-template-columns:1fr;gap:12px;padding:22px}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:34px}
.badge{border:1.5px dashed var(--rule);border-radius:14px;padding:14px;display:grid;gap:6px;justify-items:start;color:var(--mute)}
.badge .ic{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center}
.badge b{font-size:15px;color:var(--mute);font-weight:600;line-height:1.25}
.badge small{font-size:13px}
.badge.got{border-style:solid;border-color:rgba(215,239,79,.45);background:rgba(215,239,79,.06)}
.badge.got .ic{background:var(--ball);border-color:var(--ball);color:var(--night)}
.badge.got b{color:var(--line)}
.jgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start}
@media (max-width:860px){.jgrid{grid-template-columns:1fr}}
.panel{background:var(--deep);border-radius:18px;padding:24px;display:grid;gap:18px;min-width:0}
.panel h3{font-size:26px}
.f{display:grid;gap:7px;font-size:15px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{width:100%;min-width:0;background:var(--night);border:1px solid var(--rule);border-radius:10px;padding:11px 13px;color:var(--line)}
.field:focus{border-color:var(--court-hi);outline:none}
textarea.field{min-height:92px;resize:vertical;line-height:1.5}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.scale button{border:1px solid var(--rule);background:var(--night);border-radius:8px;padding:11px 0;font-weight:700;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--ball);border-color:var(--ball);color:#000}
.sdesc{color:var(--mute);font-size:15px;min-height:1.5em}
details.legend{color:var(--mute);font-size:15px}
details.legend summary{cursor:pointer;color:var(--line);font-weight:600}
details.legend ul{padding-left:18px;margin:8px 0 0}
.chart svg{display:block;width:100%;height:auto}
.entry{border-top:1px solid var(--rule);padding-block:16px;display:grid;gap:8px}
.entry:first-of-type{border-top:0;padding-top:4px}
.entry .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.entry .score{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--court-hi)}
.entry .q{font-size:13px;color:var(--mute);font-weight:600}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.linkbtn{background:none;border:0;color:var(--mute);font-weight:600;font-size:14px;padding:4px 0}
.linkbtn:hover{color:var(--line)}

footer{border-top:1px solid var(--rule);margin-top:64px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;padding-block:36px 48px}
footer p{margin:0;max-width:46ch}
footer .fin{font-family:var(--display);font-weight:800;font-size:26px;color:var(--line);margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--line);color:var(--night);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);z-index:30;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#toast.badge-earned{background:var(--ball)}
@media (prefers-reduced-motion:no-preference){
  #toast{animation:pop .35s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
}
[hidden]{display:none!important}
</style>
<script src="content.js"></script>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="mark" href="#classroom" aria-label="MTC home">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><path d="M15 1v17M1 18h28" stroke="#FFFFFF" stroke-width="2.4"/><circle cx="22" cy="24" r="2.6" fill="#D7EF4F"/></svg>
    <span>MTC</span>
  </a>
  <nav class="tabs" aria-label="Sections"><a href="#classroom" data-tab="classroom">Classroom</a><a href="#routines" data-tab="routines">Routines</a><a href="#journal" data-tab="journal">Journal</a></nav>
</div></header>

<main id="app"></main>

<footer><div class="wrap">
  <div><div class="fin">One point at a time.</div><p class="mute">New lessons and ideas go out in the newsletter first. Made by <span id="fcoach"></span>.</p></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn pri" id="sublink" href="#" target="_blank" rel="noopener">Read the newsletter</a><a class="btn" id="iglink" href="#" target="_blank" rel="noopener">Instagram</a></div>
</div></footer>
<div id="toast" hidden></div>

<script>
(function(){
const K=window.KIT||{}, app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const toastEl=document.getElementById('toast');
function toast(m,special){toastEl.textContent=m;toastEl.className=special?'badge-earned':'';toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.hidden=true,special?4200:2800)}
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dkey(d)};
const fmt=k=>parse(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function ytId(u){u=String(u||'').trim();if(!u)return '';const m=u.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);if(m)return m[1];return /^[A-Za-z0-9_-]{11}$/.test(u)?u:''}
function video(u,title){const id=ytId(u);return `<div class="vid">${id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="${esc(title)}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`:`<div class="soon"><div><b>Coming soon</b>This video is on its way. You’ll hear about it in the newsletter.</div></div>`}</div>`}

/* ----- data ----- */
const MODS=(K.modules&&K.modules.length?K.modules:[{title:'Lessons',lessons:K.lessons||[]}]).map((m,mi)=>({title:m.title,lessons:(m.lessons||[]).map((l,li)=>Object.assign({},l,{key:mi+'.'+li+'|'+(l.title||''),mi,li}))}));
const ALL=MODS.flatMap(m=>m.lessons);
let done=store.get('mtc-done',{});
const isDone=l=>!!done[l.key];

document.title=K.title||document.title;
document.getElementById('fcoach').textContent=K.coach||'';
if(K.substack)document.getElementById('sublink').href=K.substack;
if(K.instagram)document.getElementById('iglink').href=K.instagram;

const courtSvg=`<div class="courtbg" aria-hidden="true"><svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3"><rect x="-40" y="60" width="1280" height="580"/><path d="M-40 130H1240M-40 570H1240M300 130V570M900 130V570M300 350H900M600 40V660"/></g></svg></div>`;

/* ----- views ----- */
function viewClassroom(){
  const n=ALL.filter(isDone).length, first=K.title||'';
  const photo=K.photo?`<img src="${esc(K.photo)}" alt="${esc(K.coach)} on the tennis court">`:`<div class="noimg">${esc((K.coach||'B').charAt(0))}</div>`;
  const next=ALL.find(l=>!isDone(l))||ALL[0];
  return `<section class="hero">${courtSvg}<div class="wrap">
    <div>
      <h1>${esc(first)}</h1>
      <p class="promise">${esc(K.promise||'')}</p>
      <p class="hello">${esc(K.hello||'')}</p>
      <div class="cta">${next?`<a class="btn pri" href="#lesson/${encodeURIComponent(next.key)}">${n?'Continue where you left off':'Start the first lesson'}</a>`:''}<a class="btn" href="#journal">Open your journal</a></div>
      ${ytId(K.welcomeVideo)?`<div style="max-width:560px;margin-top:28px">${video(K.welcomeVideo,'Welcome')}</div>`:''}
    </div>
    <div class="box"><div class="ph">${photo}</div><div class="frame"></div><div class="tag">${esc(K.coach||'')}<small>Former college captain · coach</small></div></div>
  </div></section>
  <section class="sec wrap" id="classroom-list">
    <div class="sech"><h2>Classroom</h2><div class="overall"><span>${n} of ${ALL.length} lessons done</span><span class="track"><i style="width:${ALL.length?n/ALL.length*100:0}%"></i></span></div></div>
    <p class="lead">Watch one lesson, try it in your next practice, then write about it in your journal. New lessons get added over time.</p>
    ${MODS.map(m=>{const d=m.lessons.filter(isDone).length;return `<div class="module"><div class="mhead"><h3>${esc(m.title)}</h3><span class="mute" style="font-size:15px">${d} of ${m.lessons.length} done</span></div>
      <div class="lessons">${m.lessons.map((l,i)=>`<a class="lrow${isDone(l)?' done':''}" href="#lesson/${encodeURIComponent(l.key)}"><span class="n">${isDone(l)?'✓':i+1}</span><span><span class="t">${esc(l.title)}</span>${ytId(l.video)?'':'<br><span class="s">Video coming soon</span>'}</span><span class="r">${l.minutes?esc(l.minutes)+' min':''}</span></a>`).join('')}</div></div>`}).join('')}
  </section>`;
}
function viewLesson(key){
  const i=ALL.findIndex(l=>l.key===key);if(i<0)return viewClassroom();
  const l=ALL[i],m=MODS[l.mi],prev=ALL[i-1],next=ALL[i+1];
  return `<section class="sec wrap lesson">
    <a class="back" href="#classroom">← Classroom</a>
    <div class="mute" style="font-size:15px;margin-bottom:6px">${esc(m.title)} · lesson ${l.li+1} of ${m.lessons.length}</div>
    <h2>${esc(l.title)}</h2>
    ${video(l.video,l.title)}
    <div class="lbody"><p>${esc(l.summary||'')}</p>${l.todo?`<div class="try"><b>Try it this week</b>${esc(l.todo)}</div>`:''}</div>
    <div class="lnav">
      <button class="btn ${isDone(l)?'':'pri'}" data-done="${esc(l.key)}">${isDone(l)?'✓ Done · mark as not done':'Mark as done'}</button>
      <span style="display:flex;gap:10px;flex-wrap:wrap">${prev?`<a class="btn sm" href="#lesson/${encodeURIComponent(prev.key)}">Previous</a>`:''}${next?`<a class="btn sm" href="#lesson/${encodeURIComponent(next.key)}">Next lesson</a>`:''}</span>
    </div></section>`;
}
function viewRoutines(){
  return `<section class="sec wrap"><div class="sech"><h2>Routines</h2></div>
    <p class="lead">Short routines you can use on court, in practice and in matches. Pick one and use it until it’s automatic.</p>
    <div class="routines">${(K.exercises||[]).map(x=>`<article class="routine"><h3>${esc(x.title)}</h3>${x.when?`<div class="when">${esc(x.when)}</div>`:''}<ol>${(x.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></article>`).join('')}</div></section>`;
}

/* ----- journal + streaks + badges ----- */
const J=K.journal||{},Q=J.questions||[],S=(J.scale||[]).slice().sort((a,b)=>b[0]-a[0]);
let entries=store.get('mtc-journal',[]), rating=null;
const scaleText=v=>{const s=S.find(x=>v>=x[0]);return s?s[1]:''};
function dayset(){return new Set(entries.map(e=>e.date))}
function streaks(){const D=dayset();let cur=0,k=today();if(!D.has(k))k=addDays(k,-1);while(D.has(k)){cur++;k=addDays(k,-1)}
  const sorted=[...D].sort();let best=0,run=0,prev=null;sorted.forEach(d=>{run=prev&&addDays(prev,1)===d?run+1:1;best=Math.max(best,run);prev=d});return {cur,best}}
const BADGES=[
  {id:'first',name:'First entry',hint:'Write your first journal entry',ic:'1',test:()=>entries.length>=1},
  {id:'s3',name:'3 days in a row',hint:'Journal three days in a row',ic:'3',test:()=>streaks().best>=3},
  {id:'s7',name:'7 days in a row',hint:'A full week without missing',ic:'7',test:()=>streaks().best>=7},
  {id:'match',name:'Match day',hint:'Journal after a match',ic:'M',test:()=>entries.some(e=>e.type==='Match')},
  {id:'eight',name:'Locked in',hint:'Rate yourself 8 or higher',ic:'8',test:()=>entries.some(e=>e.rating>=8)},
  {id:'comeback',name:'Bounce back',hint:'Improve by 3+ points on your last entry',ic:'↑',test:()=>{const E=entries.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));return E.some((e,i)=>i>0&&e.rating-E[i-1].rating>=3)}},
  {id:'ten',name:'10 entries',hint:'Ten reflections written',ic:'10',test:()=>entries.length>=10},
  {id:'thirty',name:'30 entries',hint:'Thirty reflections. That’s a habit.',ic:'30',test:()=>entries.length>=30}
];
function viewJournal(){
  const {cur,best}=streaks(),D=dayset(),t=today();
  const last7=[];for(let i=6;i>=0;i--)last7.push(addDays(t,-i));
  const E=entries.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.t||0)-(a.t||0));
  const C=E.slice(0,20).reverse();
  let chart='';if(C.length>1){const W=600,H=160,P=26,X=i=>P+i*(W-2*P)/(C.length-1),Y=v=>H-22-(v/10)*(H-40);
    chart=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your present-moment ratings over time">${[0,5,10].map(v=>`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.14)"/><text x="${P-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="#A6B1C8">${v}</text>`).join('')}
      <polyline points="${C.map((e,i)=>X(i).toFixed(1)+','+Y(e.rating).toFixed(1)).join(' ')}" fill="none" stroke="#79A9F6" stroke-width="2.4" stroke-linejoin="round"/>
      ${C.map((e,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(e.rating).toFixed(1)}" r="${e.type==='Match'?5.5:4}" fill="${e.type==='Match'?'#D7EF4F':'#79A9F6'}"><title>${esc(fmt(e.date))}: ${e.rating}/10</title></circle>`).join('')}</svg>
      <div class="mute" style="font-size:14px">Your last ${C.length} ratings. Yellow dots are matches.</div></div>`}
  return `<section class="sec wrap">
    <div class="sech"><h2>Journal</h2><span class="mute" style="font-size:15px">${J.focus?'This month’s focus: '+esc(J.focus):''}</span></div>
    <p class="lead">Two minutes after every practice or match. Your entries stay on this phone. Nobody else can read them, not even me.</p>
    <div class="streak"><div class="flame${cur?' on':''}">${cur}</div>
      <div><div class="lbl">${cur===1?'day in a row':'days in a row'}</div><div class="sub">${cur?(D.has(t)?'You’ve journaled today. Nice work.':'Journal today to keep it going.'):'Write today’s entry to start a streak.'} Longest: ${best}</div>
      <div class="days" aria-label="Last 7 days">${last7.map(d=>`<span class="${D.has(d)?'on':''}${d===t?' today':''}" title="${esc(fmt(d))}">${'SMTWTFS'[parse(d).getDay()]}</span>`).join('')}</div></div></div>
    <div class="badges">${BADGES.map(b=>{const g=b.test();return `<div class="badge${g?' got':''}"><span class="ic" aria-hidden="true">${g?esc(b.ic):''}</span><b>${esc(b.name)}</b><small>${g?'Earned':esc(b.hint)}</small></div>`}).join('')}</div>
    <div class="jgrid">
      <div class="panel"><h3>Today’s entry</h3>
        <div class="two"><label class="f">Date<input class="field" type="date" id="j-date" value="${today()}"></label><label class="f">Practice or match<select class="field" id="j-type"><option>Practice</option><option>Match</option></select></label></div>
        <div style="display:grid;gap:8px"><span class="f" id="scale-label">How well did you stay present? 0 to 10</span>
          <div class="scale" role="group" aria-labelledby="scale-label">${Array.from({length:11},(_,i)=>`<button type="button" data-v="${i}" aria-pressed="${rating===i}">${i}</button>`).join('')}</div>
          <div class="sdesc" id="sdesc">${rating==null?'Tap a number.':esc(scaleText(rating))}</div>
          <details class="legend"><summary>What the numbers mean</summary><ul>${S.map(([n,t])=>`<li><b>${n}</b>: ${esc(t)}</li>`).join('')}</ul></details></div>
        ${Q.map((q,i)=>`<label class="f">${esc(q)}<textarea class="field" id="j-q${i}" data-q="${i}">${esc((store.get('mtc-draft',{})||{})['q'+i]||'')}</textarea></label>`).join('')}
        <div><button class="btn pri" id="j-save">Save entry</button></div>
      </div>
      <div class="panel"><h3>Your entries</h3>${chart}
        <div>${E.length?E.map(e=>`<div class="entry"><div class="h"><span><b>${esc(fmt(e.date))}</b> <span class="mute">· ${esc(e.type)}</span></span><span class="score">${e.rating}<small style="font-size:15px;color:var(--mute)">/10</small></span></div>
          ${Q.map((q,i)=>e.a&&e.a[i]?`<div><div class="q">${esc(q)}</div><p>${esc(e.a[i])}</p></div>`:'').join('')}<div><button class="linkbtn" data-del="${e.id}">Delete</button></div></div>`).join(''):'<p class="mute" style="margin:0">Your saved entries will show up here, with a chart of how present you stayed over time.</p>'}</div>
        ${E.length?'<div><button class="btn sm" id="j-export">Download my journal</button></div>':''}
      </div>
    </div></section>`;
}

/* ----- router ----- */
function route(){
  const h=decodeURIComponent((location.hash||'#classroom').slice(1));
  let tab='classroom',html;
  if(h.startsWith('lesson/')){html=viewLesson(h.slice(7))}
  else if(h==='routines'){tab='routines';html=viewRoutines()}
  else if(h==='journal'){tab='journal';html=viewJournal()}
  else html=viewClassroom();
  app.innerHTML=html;
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

/* ----- events ----- */
app.addEventListener('click',e=>{
  const d=e.target.closest('[data-done]');
  if(d){const k=d.dataset.done;if(done[k])delete done[k];else done[k]=true;store.set('mtc-done',done);
    const was=!!done[k];route();if(was){const i=ALL.findIndex(l=>l.key===k);toast(ALL[i+1]?'Done. Next lesson is ready when you are.':'Done. That’s every lesson so far.')}return}
  const s=e.target.closest('.scale button');
  if(s){rating=+s.dataset.v;document.querySelectorAll('.scale button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===rating)));document.getElementById('sdesc').textContent=scaleText(rating);return}
  if(e.target.id==='j-save'){
    if(rating==null){toast('Pick a number from 0 to 10 first.');return}
    const before=new Set(BADGES.filter(b=>b.test()).map(b=>b.id));
    entries.push({id:Math.random().toString(36).slice(2,10),t:Date.now(),date:document.getElementById('j-date').value||today(),type:document.getElementById('j-type').value,rating,a:Q.map((q,i)=>document.getElementById('j-q'+i).value.trim())});
    if(!store.set('mtc-journal',entries)){entries.pop();toast('Your browser blocked saving. Try a normal (not private) window.');return}
    store.set('mtc-draft',{});rating=null;
    const earned=BADGES.filter(b=>b.test()&&!before.has(b.id));
    route();window.scrollTo({top:0,behavior:'smooth'});
    if(earned.length)toast('New badge: '+earned.map(b=>b.name).join(', '),true);else toast('Entry saved. See you after the next one.');
    return}
  const del=e.target.closest('[data-del]');
  if(del){if(!del.dataset.sure){del.dataset.sure='1';del.textContent='Tap again to delete';return}entries=entries.filter(x=>x.id!==del.dataset.del);store.set('mtc-journal',entries);route();return}
  if(e.target.id==='j-export'){
    const txt=entries.slice().sort((a,b)=>a.date<b.date?-1:1).map(e=>`${fmt(e.date)} · ${e.type} · ${e.rating}/10\n`+Q.map((q,i)=>e.a&&e.a[i]?`${q}\n${e.a[i]}\n`:'').join('')).join('\n----------\n\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='my-tennis-journal.txt';document.body.appendChild(a);a.click();a.remove();return}
});
app.addEventListener('input',e=>{const q=e.target.dataset&&e.target.dataset.q;if(q==null)return;const d=store.get('mtc-draft',{})||{};d['q'+q]=e.target.value;store.set('mtc-draft',d)});

/* old version stored lessons as "watched": carry nothing over (keys changed), journal entries are kept */
route();
})();
</script>
</body>
</html>
